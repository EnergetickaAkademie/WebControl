services:
  coreapi:
    build: ./CoreAPI
    container_name: webcontrol-coreapi-1
    environment:
      - JWT_SECRET=your-secret-key-change-in-production
      - DEBUG=true  # Enable verbose logging for debug mode
      - BOARD_STATE_DB_PATH=/app/data/board_state.db
      - FIRMWARE_STATE_DIR=/app/data/firmware
      - MQTT_ENABLED=${MQTT_ENABLED:-false}
      - MQTT_V3_ENABLED=${MQTT_V3_ENABLED:-false}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=coreapi
      - MQTT_PASSWORD=${MQTT_COREAPI_PASSWORD:-}
      - MQTT_PUBLIC_URI=${MQTT_PUBLIC_URI:-ws://localhost/mqtt}
    volumes:
      - ./config:/app/config:ro
      - coreapi-state:/app/data
    networks:
      - app-network
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: webcontrol-mosquitto-debug-1
    environment:
      MQTT_COREAPI_PASSWORD: ${MQTT_COREAPI_PASSWORD:-}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.debug
    container_name: webcontrol-frontend-debug-1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: webcontrol-nginx-debug-1
    ports:
      - "80:80"
    volumes:
      - ./nginx.debug.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      coreapi:
        condition: service_started
      mosquitto:
        condition: service_started
      frontend:
        condition: service_healthy # Wait for frontend to be healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  coreapi-state:
  mosquitto-data:
