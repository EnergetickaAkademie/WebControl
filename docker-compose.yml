# Production docker-compose configuration
# For development/debug mode, use: docker-compose -f docker-compose.debug.yml up --build
# Or set DEBUG=true in environment below for verbose logging

services:
  # CoreAPI (Now uses Simple Auth)
  coreapi:
    build: ./CoreAPI
    container_name: webcontrol-coreapi-1
    environment:
      - JWT_SECRET=your-secret-key-change-in-production
      - DEBUG=false  # Set to 'true' for verbose logging
      - BOARD_STATE_DB_PATH=/app/data/board_state.db
      - FIRMWARE_STATE_DIR=/app/data/firmware
      - MQTT_ENABLED=${MQTT_ENABLED:-false}
      - MQTT_V3_ENABLED=${MQTT_V3_ENABLED:-false}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=coreapi
      - MQTT_PASSWORD=${MQTT_COREAPI_PASSWORD:-}
      - MQTT_PUBLIC_URI=${MQTT_PUBLIC_URI:-wss://localhost/mqtt}
    volumes:
      - ./config:/app/config:ro
      - coreapi-state:/app/data
    networks:
      - app-network
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: webcontrol-mosquitto-1
    environment:
      MQTT_COREAPI_PASSWORD: ${MQTT_COREAPI_PASSWORD:-}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u coreapi -P \"$${MQTT_COREAPI_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx (Frontend + Reverse Proxy)
  nginx:
    build: ./frontend
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - coreapi
      - mosquitto
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  coreapi-state:
  mosquitto-data:
